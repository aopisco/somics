schema:
  name: spatial_transcriptomics_atlas
  doc: |
    Spatial transcriptomics atlas schema.

    One obs row is a single measured spatial unit — a segmented cell or nucleus
    (Xenium, MERFISH, CosMx, CARTANA, STARmap, seqFISH), a capture spot
    (Visium), a square bin (Visium HD), or a bead (Slide-seqV2) — carrying its
    position in the tissue and, optionally, crops of the images taken of that
    tissue. Every measurement modality is an optional pointer, so a row may have
    expression only, expression plus imagery, or imagery only.

    Physical position lives on the obs table itself (x_um/y_um/z_um), since a
    coordinate is a property of the measured unit rather than a feature space.
    Imagery is stored once per section as a `discrete_image` and addressed by
    per-row DiscreteSpatialPointer boxes, so overlapping crops share pixels.

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------
enums:
  SpatialUnit:
    doc: "The physical entity a single obs row measures."
    values:
      CELL: cell
      NUCLEUS: nucleus
      SPOT: spot
      BIN: bin
      BEAD: bead
      TRANSCRIPT_NEIGHBORHOOD: transcript_neighborhood
      OTHER: other

  SpatialTechnology:
    doc: |
      The spatial platform, as a controlled name.

      Kept alongside the EFO-aligned `assay` column because EFO does not
      separate every platform in this corpus — Visium HD shares EFO:0010961
      with Visium, and CARTANA has no EFO term at all.
    values:
      VISIUM: visium
      VISIUM_HD: visium_hd
      XENIUM: xenium
      MERFISH: merfish
      COSMX: cosmx
      CARTANA: cartana
      SLIDESEQ_V2: slideseqv2
      STARMAP: starmap
      STARMAP_PLUS: starmap_plus
      SEQFISH: seqfish
      IMC: imc
      OTHER: other

  DiseaseState:
    doc: |
      Coarse health status, kept separate from the MONDO `disease` term so that
      "healthy" is distinguishable from "not reported" (both leave `disease`
      null). Corresponds to PATO:0000461 vs an unknown/absent annotation in the
      source corpus.
    values:
      HEALTHY: healthy
      DISEASED: diseased
      UNKNOWN: unknown

  Sex:
    doc: "Donor sex. PATO is not a registered ontology, so this is an enum."
    values:
      FEMALE: female
      MALE: male
      MIXED: mixed
      UNKNOWN: unknown

  AgeUnit:
    doc: "Unit for DonorSchema.age_value."
    values:
      DAY: day
      WEEK: week
      MONTH: month
      YEAR: year
      CARNEGIE_STAGE: carnegie

  LifeStage:
    doc: "Coarse life stage, for grouping without an ontology lookup."
    values:
      EMBRYONIC: embryonic
      FETAL: fetal
      NURSING: nursing
      JUVENILE: juvenile
      YOUNG_ADULT: young_adult
      MIDDLE_AGED: middle_aged
      LATE_ADULT: late_adult
      UNKNOWN: unknown

  Preservation:
    doc: "How the tissue section was preserved before profiling."
    values:
      FFPE: ffpe
      FRESH_FROZEN: fresh_frozen
      FIXED_FROZEN: fixed_frozen
      FRESH: fresh
      OTHER: other
      UNKNOWN: unknown

  SegmentationMethod:
    doc: |
      How the boundary of an obs row was defined. GRID for assays whose units
      are defined by the capture grid (Visium spots, Visium HD bins, Slide-seq
      beads) rather than by segmentation; null only when the method is
      unreported, so "laid out by the grid" stays distinguishable from
      "not annotated".
    values:
      NUCLEUS_EXPANSION: nucleus_expansion
      CELL_BOUNDARY_STAIN: cell_boundary_stain
      WATERSHED: watershed
      CELLPOSE: cellpose
      BAYSOR: baysor
      PROSEG: proseg
      MANUAL: manual
      GRID: grid
      OTHER: other

  ImageModality:
    doc: "What a section image depicts."
    values:
      HE: he
      MORPHOLOGY: morphology
      IMMUNOFLUORESCENCE: immunofluorescence
      DAPI: dapi
      OTHER: other

  FeatureType:
    doc: |
      The level of resolution a measured feature represents. Targeted panels
      report control probes and blank codewords in the same var axis as real
      genes, so they get their own members rather than being dropped.
    values:
      GENE: gene
      TRANSCRIPT: transcript
      PROBE: probe
      NEGATIVE_CONTROL_PROBE: negative_control_probe
      NEGATIVE_CONTROL_CODEWORD: negative_control_codeword
      BLANK_CODEWORD: blank_codeword
      GENOMIC_CONTROL: genomic_control
      ANTISENSE_CONTROL: antisense_control
      DEPRECATED_CODEWORD: deprecated_codeword
      OTHER: other

# ---------------------------------------------------------------------------
# Obs table  ->  HoxBaseSchema
# ---------------------------------------------------------------------------
obs_tables:
  - name: SpatialObs
    presence_flags: true
    doc: |
      A single measured spatial unit and its position in a tissue section.

      Rows from every platform in the corpus share this table; what differs
      between platforms is which columns and pointers are populated, not which
      table the row lives in. `spatial_unit` says what the row physically is,
      and `unit_size_um` gives its footprint where one is defined.
    fields:
      # -- provenance of the row itself ------------------------------------
      - name: source_obs_id
        type: str | None
        doc: >-
          The row identifier as published — a Visium barcode, a Xenium cell_id,
          a Slide-seq bead barcode. Kept so a row can be traced back to the
          original files and joined against source-side annotations.

      # -- what and where --------------------------------------------------
      - name: spatial_unit
        type: SpatialUnit
        doc: "The physical entity this row measures."
      - name: assay
        type: str
        ontology_aligned: EFO
        doc: 'Assay as an EFO term, e.g. "EFO:0022615" for Xenium.'
      - name: technology
        type: SpatialTechnology
        doc: "Platform name; disambiguates assays EFO conflates."
      - name: organism
        type: str
        ontology_aligned: NCBITaxon
        doc: 'NCBITaxon:9606 (human) or NCBITaxon:10090 (mouse) in this corpus.'

      - name: x_um
        type: float
        doc: >-
          Position along the section's first in-plane axis, in microns, in the
          canonical physical frame of the section. Centroid for segmented
          units, capture-centre for spots, bins, and beads.
      - name: y_um
        type: float
        doc: "Position along the section's second in-plane axis, in microns."
      - name: z_um
        type: float | None
        default: null
        doc: >-
          Depth in microns for volumetric assays (STARmap PLUS, 3D MERFISH).
          Null for the 2D assays that make up most of the corpus.
      - name: x_px
        type: float | None
        default: null
        doc: >-
          Position in the pixel frame of the section image this row's crops
          index into. Stored alongside the micron frame because the two are
          related by a per-image scale factor and origin that is not always
          recoverable after ingestion.
      - name: y_px
        type: float | None
        default: null
        doc: "Position along the second image axis, in pixels."
      - name: pixel_size_um
        type: float | None
        default: null
        doc: >-
          Microns per pixel of the image the crop pointers address, i.e. the
          conversion between the micron and pixel frames above.
      - name: unit_size_um
        type: float | None
        default: null
        doc: >-
          Footprint of the measured unit in microns: spot or bead diameter
          (55 for Visium, 10 for Slide-seqV2), bin edge length for Visium HD.
          Null for segmented units, whose extent is in `cell_area_um2`.

      # -- entity references -----------------------------------------------
      - name: section_uid
        type: str | None
        default: null
        registry_key: { target_schema: TissueSectionSchema }
        doc: "The physical section this row was measured on."
      - name: donor_uid
        type: str | None
        default: null
        registry_key: { target_schema: DonorSchema }
        doc: >-
          The donor this row came from. Denormalized from the section for
          query convenience; must agree with TissueSectionSchema.donor_uid.
      - name: panel_uid
        type: str | None
        default: null
        registry_key: { target_schema: PanelSchema }
        doc: >-
          The probe panel measured on this row. Null for whole-transcriptome
          capture assays that use no panel.

      # -- biological annotation -------------------------------------------
      - name: tissue
        type: str | None
        ontology_aligned: UBERON
        doc: "The tissue sampled, as UBERON. Denormalized from the section."
      - name: anatomical_region
        type: str | None
        default: null
        ontology_aligned: UBERON
        doc: >-
          Sub-tissue region this row falls in — a cortical layer, a glomerulus,
          a crypt. Finer than `tissue`, and assigned per row rather than per
          section.
      - name: disease_state
        type: DiseaseState
        default: unknown
        doc: "Coarse health status; distinguishes healthy from unannotated."
      - name: disease
        type: str | None
        default: null
        ontology_aligned: MONDO
        doc: >-
          The most specific disease term available for this row. MONDO encodes
          the hierarchy, so coarser groupings (e.g. cancer, MONDO:0004992) are
          recovered by ontology traversal rather than stored as extra columns.
          Null when healthy or unannotated — see `disease_state`.
      - name: cell_type
        type: str | None
        default: null
        ontology_aligned: CL
        doc: "Harmonized cell type as a Cell Ontology term."
      - name: cell_type_original
        type: str | None
        default: null
        doc: >-
          The label as published, before harmonization. Preserved because the
          mapping to CL is lossy and sometimes contested.

      # -- QC and segmentation ---------------------------------------------
      - name: n_counts
        type: float | None
        default: null
        doc: "Total transcripts or UMIs assigned to this row."
      - name: n_genes
        type: int | None
        default: null
        doc: "Number of distinct genes detected in this row."
      - name: negative_control_counts
        type: float | None
        default: null
        doc: >-
          Counts assigned to negative-control probes — the specificity metric
          for imaging-based assays. Null for capture-based assays.
      - name: unassigned_counts
        type: float | None
        default: null
        doc: >-
          Counts on unassigned, blank, or deprecated codewords, where the
          platform reports them separately from negative controls.
      - name: cell_area_um2
        type: float | None
        default: null
        doc: "Area of the segmented cell boundary in square microns."
      - name: nucleus_area_um2
        type: float | None
        default: null
        doc: "Area of the segmented nucleus in square microns."
      - name: segmentation_method
        type: SegmentationMethod | None
        default: null
        doc: >-
          How this row's boundary was defined. Capture-grid assays record
          `grid` rather than null, so an unsegmented unit is distinguishable
          from one whose method was never reported.
      - name: in_tissue
        type: bool | None
        default: null
        doc: >-
          Whether the unit overlaps tissue rather than empty slide — Visium's
          in_tissue flag and its equivalents.
      - name: passes_qc
        type: bool | None
        default: null
        doc: >-
          The source's own filtering verdict, carried through rather than
          applied, so downstream users can choose their own threshold.
      - name: additional_metadata
        type: str | None
        default: null
        doc: "JSON dump for source columns that do not fit this schema."

      # -- pointers ---------------------------------------------------------
      - name: gene_expression
        type: SparseZarrPointer | None
        default: null
        pointer:
          feature_space: gene_expression
          feature_registry_schema: GenomicFeatureSchema
      - name: protein_abundance
        type: DenseZarrPointer | None
        default: null
        doc: "Multiplexed protein readout, e.g. CosMx protein panels."
        pointer:
          feature_space: protein_abundance
          feature_registry_schema: ProteinSchema
      - name: image_features
        type: DenseZarrPointer | None
        default: null
        doc: "Per-row image embeddings or morphology statistics."
        pointer:
          feature_space: image_features
          feature_registry_schema: ImageFeatureSchema
      - name: he_crop
        type: DiscreteSpatialPointer | None
        default: null
        doc: >-
          Box into the section's H&E image. No feature registry: pixels are not
          features. Crops are boxes into one stored image rather than copied
          tiles, so neighbouring rows share overlapping pixels instead of
          duplicating them.
        pointer:
          feature_space: discrete_image
      - name: morphology_crop
        type: DiscreteSpatialPointer | None
        default: null
        doc: >-
          Box into the section's morphology stack — DAPI, boundary, and
          interior-RNA channels on Xenium, MERFISH, and CosMx. Channels are
          trailing axes of the stored array and are named on the section image
          row, so this pointer boxes the spatial axes only.
        pointer:
          feature_space: discrete_image

# ---------------------------------------------------------------------------
# Dataset table  ->  DatasetSchema
# ---------------------------------------------------------------------------
dataset_table:
  name: SpatialDatasetSchema
  doc: |
    One ingested dataset: the unit of provenance in the corpus, roughly a
    published sample or a vendor showcase release.
  fields:
    - name: publication_uid
      type: str | None
      default: null
      registry_key: { target_schema: PublicationSchema }
    - name: study_name
      type: str | None
      default: null
      doc: 'Free-text study the dataset belongs to, as named by the source.'
    - name: sample_name
      type: str | None
      default: null
      doc: 'Sample label as published, e.g. "Xenium Human Brain 2".'
    - name: source_dataset_id
      type: str | None
      default: null
      doc: "The corpus-side dataset identifier, where one was assigned."
    - name: folder_name
      type: str | None
      default: null
      doc: "Vendor or source folder name; often the most stable source key."
    - name: accession_database
      type: str | None
      default: null
      doc: 'Database the data came from, e.g. "GEO", "Zenodo", "CELLxGENE".'
    - name: accession_id
      type: str | None
      default: null
      doc: 'Accession within that database, e.g. "GSE234713".'
    - name: data_access_link
      type: str | None
      default: null
      doc: "Landing page describing the dataset."
    - name: download_url
      type: str | None
      default: null
      doc: >-
        Direct download URL for the raw files. Pipe-separated when a dataset
        ships as several files.
    - name: source_path
      type: str | None
      default: null
      doc: "Path to the raw files on local storage, when not fetched online."
    - name: panel_uid
      type: str | None
      default: null
      registry_key: { target_schema: PanelSchema }
    - name: dataset_description
      type: str | None
      default: null
      doc: "Sample-prep and protocol text from the source record."
    - name: n_rows
      type: int
      default: 0
      summary: { target_schema: SpatialObs, target_field: uid, op: count }
    - name: n_sections
      type: int
      default: 0
      summary: { target_schema: SpatialObs, target_field: section_uid, op: nunique }
    - name: organism
      type: list[str] | None
      default: null
      summary: { target_schema: SpatialObs, target_field: organism, op: unique }
    - name: tissue
      type: list[str] | None
      default: null
      summary: { target_schema: SpatialObs, target_field: tissue, op: unique }
    - name: disease
      type: list[str] | None
      default: null
      summary: { target_schema: SpatialObs, target_field: disease, op: unique }
    - name: assay
      type: list[str] | None
      default: null
      summary: { target_schema: SpatialObs, target_field: assay, op: unique }

# ---------------------------------------------------------------------------
# Feature registry tables  ->  FeatureBaseSchema
# ---------------------------------------------------------------------------
feature_registry_tables:
  - name: GenomicFeatureSchema
    doc: |
      A single measurable feature in a dataset's var space.

      Spans whole-transcriptome capture assays and targeted panels, so the
      registry must hold both Ensembl-identified genes and panel probes and
      control codewords that map to no gene at all.
    fields:
      - name: feature_key
        type: str
        stable_uid: true
        doc: >-
          The identity a feature dedupes on corpus-wide, composed as
          organism:feature_id — for example Homo sapiens:ENSG00000243485.
          The organism half is the NCBITaxon label the `organism` column holds,
          not its CURIE, so the two columns stay consistent.
          It is a separate column because the uid must be stable across
          datasets while feature_id alone is not unique: Ensembl IDs are
          species-specific, but the probe and blank-codeword names that stand
          in for them on targeted panels are not, so a codeword like
          BLANK_0001 would otherwise merge a human and a mouse panel into one
          feature. Composing the organism in keeps the two apart, and one
          column is what compute_stable_uids can key on.
      - name: feature_id
        type: str
        doc: >-
          The feature identity as measured. The Ensembl gene ID where one
          exists; otherwise the panel's own probe or codeword name.
      - name: feature_type
        type: FeatureType
        doc: "What this feature is — a gene, a probe, or a control codeword."
      - name: gene_name
        type: str | None
        default: null
        doc: "Canonical gene symbol this feature maps to, if any."
      - name: ensembl_gene_id
        type: str | None
        default: null
        cross_reference: ENSEMBL
      - name: organism
        type: str
        ontology_aligned: NCBITaxon
        doc: >-
          The organism this feature belongs to. Required, because panel probe
          names collide across species where Ensembl IDs would not.
      - name: ensembl_version
        type: str | None
        default: null
        doc: "Ensembl release used for the annotation, if known."
      - name: is_control
        type: bool
        default: false
        doc: >-
          Whether the feature is a control rather than a biological target.
          Redundant with `feature_type` but cheap to filter on.

  - name: ProteinSchema
    doc: |
      A protein target in a multiplexed protein panel.

      A row is a target as an antibody measures it, not a protein entry as
      UniProt defines it: a phospho-specific antibody and one against the
      unmodified protein share an accession but are different measurements,
      and are therefore different features.
    fields:
      - name: protein_key
        type: str
        stable_uid: true
        doc: >-
          The identity a protein target dedupes on corpus-wide, composed as
          organism:target_id — for example Homo sapiens:P01732 for CD8a.
          The organism half is the NCBITaxon label the `organism` column holds,
          not its CURIE, matching GenomicFeatureSchema.feature_key.
          The target_id half is the UniProt accession where one resolved,
          suffixed with +`modification` for modification-specific antibodies
          (Homo sapiens:P62753+phospho-S235/S236), and otherwise the published
          `target_name` — panels routinely carry targets that map to no single
          accession: DNA intercalators, multi-chain targets like collagen I,
          and antibodies the source names but does not identify.
          It is a separate column because `uniprot_id` is null for those
          targets and cannot be the uid, while a name alone would merge a human
          and a mouse panel's CD45 into one feature; composing the organism in
          keeps the two apart, and one column is what compute_stable_uids can
          key on.
      - name: target_name
        type: str
        doc: >-
          The target as the panel names it, e.g. "CD8a", "pS6", "DNA1".
          Required, because it is the fallback identity for targets that
          resolve to no accession, and because the panel's own label is what
          the source's channel names join against.
      - name: uniprot_id
        type: str | None
        default: null
        doc: 'UniProt accession, e.g. "P04637".'
        cross_reference: UniProt
      - name: modification
        type: str | None
        default: null
        doc: >-
          The post-translational state the antibody is specific to, e.g.
          "phospho-S235/S236", "cleaved". Null for antibodies against the
          unmodified protein, which is most of a panel.
      - name: protein_name
        type: str | None
        default: null
        doc: "Recommended protein name from UniProt."
      - name: gene_name
        type: str | None
        default: null
        doc: "Primary gene symbol encoding this protein."
      - name: antibody_clone
        type: str | None
        default: null
        doc: "Clone identifier of the detection antibody, where reported."
      - name: organism
        type: str | None
        default: null
        ontology_aligned: NCBITaxon
      - name: is_control
        type: bool
        default: false
        doc: "Whether this target is an isotype or normalization control."

  - name: ImageFeatureSchema
    doc: "One dimension of a per-row image feature vector."
    fields:
      - name: feature_name
        type: str
        stable_uid: true
        doc: 'Name of the feature, e.g. "mean_intensity_DAPI", "uni_dim_0".'
      - name: description
        type: str | None
        default: null
        doc: "What the feature measures and how it was computed."
      - name: extractor
        type: str | None
        default: null
        doc: >-
          Model or pipeline that produced the feature, e.g. a tile-encoder
          name and version. Embeddings are only comparable within an extractor.

# ---------------------------------------------------------------------------
# FK registry tables  ->  RegistryBaseSchema
# ---------------------------------------------------------------------------
fk_registry_tables:
  - name: PublicationSchema
    doc: |
      A paper or data release a dataset came from. Roughly half the corpus is
      vendor showcase data with no publication, so datasets may reference none.
    fields:
      - name: pmid
        type: int | None
        default: null
        doc: "PubMed ID; the canonical identity when the source is a paper."
        markers:
          stable_uid: true
          cross_reference: PubMed
      - name: doi
        type: str | None
        default: null
        cross_reference: DOI
      - name: title
        type: str | None
        default: null
      - name: journal
        type: str | None
        default: null
      - name: publication_date
        type: datetime | None
        default: null

  - name: DonorSchema
    doc: |
      The individual a section came from.

      The source corpus carries donor attributes but no donor identifiers, so
      `donor_id` is often null and such rows will not dedupe across datasets —
      deliberately, since two unlabelled donors of the same age and sex are not
      evidence of the same person.
    fields:
      - name: donor_id
        type: str | None
        default: null
        stable_uid: true
        doc: >-
          Source-provided donor identifier, namespaced by study where the
          source's own IDs are only locally unique.
      - name: organism
        type: str
        ontology_aligned: NCBITaxon
      - name: sex
        type: Sex
        default: unknown
      - name: age_value
        type: float | None
        default: null
        doc: "Age in `age_unit` at the time of sampling."
      - name: age_unit
        type: AgeUnit | None
        default: null
      - name: life_stage
        type: LifeStage
        default: unknown
        doc: "Coarse life stage, for grouping without an ontology lookup."
      - name: human_development_stage
        type: str | None
        default: null
        ontology_aligned: HsapDv
        doc: >-
          Developmental stage for human donors. Human and mouse stages are
          separate columns because HsapDv and MmusDv are separate ontologies,
          and a single column would resolve against the wrong one for half the
          corpus. Exactly one of the two is populated per donor.
      - name: mouse_development_stage
        type: str | None
        default: null
        ontology_aligned: MmusDv
        doc: "Developmental stage for mouse donors."
      - name: ethnicity
        type: str | None
        default: null
        ontology_aligned: HANCESTRO
        doc: "Self-reported ethnicity; human donors only, usually unreported."
      - name: clinical_diagnosis
        type: str | None
        default: null
        ontology_aligned: MONDO
        doc: >-
          The donor's diagnosis, which is not the same as the disease state of
          any one section — a cancer donor also yields normal-adjacent tissue.
      - name: description
        type: str | None
        default: null
        doc: "Free-text notes about the donor."

  - name: TissueSectionSchema
    doc: |
      One physical slice of tissue placed on a slide.

      Sections are their own entity because several datasets can describe the
      same slice — an H&E scan, a Xenium run, and a post-Xenium Visium HD run —
      and because serial sections of one block need to be relatable.
    fields:
      - name: section_id
        type: str | None
        default: null
        stable_uid: true
        doc: >-
          Stable identifier for the section, namespaced by study or slide so it
          is unique corpus-wide. Null for sections that cannot be identified
          across datasets.
      - name: donor_uid
        type: str | None
        default: null
        registry_key: { target_schema: DonorSchema }
      - name: block_id
        type: str | None
        default: null
        doc: "The tissue block this section was cut from, if known."
      - name: section_index
        type: int | None
        default: null
        doc: >-
          Ordinal position within the block, so serial sections can be ordered
          and registered to one another.
      - name: slide_id
        type: str | None
        default: null
        doc: "Slide or capture-area identifier, e.g. a Visium slide serial."
      - name: tissue
        type: str | None
        default: null
        ontology_aligned: UBERON
      - name: disease_state
        type: DiseaseState
        default: unknown
      - name: disease
        type: str | None
        default: null
        ontology_aligned: MONDO
        doc: >-
          Disease of this section specifically, which may differ from the
          donor's diagnosis for normal-adjacent or metastatic sections.
      - name: preservation
        type: Preservation
        default: unknown
      - name: section_thickness_um
        type: float | None
        default: null

  - name: PanelSchema
    doc: |
      A probe panel measured by a targeted assay.

      Panels are a first-class entity because the same panel recurs across
      datasets and because two datasets are only directly comparable in feature
      space when their panels match.
    fields:
      - name: panel_name
        type: str | None
        default: null
        stable_uid: true
        doc: >-
          Panel name including version where the vendor versions it, e.g.
          "Xenium Human Brain Panel v1", "CosMx Human Universal Cell 1000".
      - name: vendor
        type: str | None
        default: null
        doc: '"10x Genomics", "Vizgen", "NanoString", "CARTANA", or a lab name.'
      - name: version
        type: str | None
        default: null
      - name: technology
        type: SpatialTechnology | None
        default: null
        doc: "Platform the panel is designed for."
      - name: organism
        type: str | None
        default: null
        ontology_aligned: NCBITaxon
      - name: n_targets
        type: int | None
        default: null
        doc: "Number of biological targets, excluding controls."
      - name: has_custom_addon
        type: bool
        default: false
        doc: >-
          Whether a custom add-on was spiked into a base panel — common in this
          corpus, and it changes the feature axis relative to the base panel.
      - name: description
        type: str | None
        default: null

# ---------------------------------------------------------------------------
# Other tables  ->  LanceModel
# ---------------------------------------------------------------------------
other_tables:
  - name: SectionImageSchema
    doc: |
      One image acquired of one tissue section — the thing that obs crop
      pointers box into.

      Separate from the dataset row because a section can have several images
      (an H&E scan and a multichannel morphology stack), and separate from the
      section because an image carries its own frame, scale, and channel names.
    fields:
      - name: section_uid
        type: str
        registry_key: { target_schema: TissueSectionSchema }
      - name: dataset_uid
        type: str | None
        doc: "The ingested dataset whose zarr group holds these pixels."
      - name: image_modality
        type: ImageModality
        doc: "What the image depicts; selects which obs crop pointer boxes it."
      - name: channel_names
        type: list[str] | None
        doc: >-
          Names of the trailing channel axis, in stored order — ["R","G","B"]
          for H&E, ["DAPI","boundary","interior_RNA"] for a Xenium morphology
          stack. Crop pointers box the leading spatial axes and take channels
          in full, so this is how a channel is identified after a read.
      - name: pixel_size_um
        type: float | None
        doc: "Microns per pixel at full resolution."
      - name: height_px
        type: int | None
      - name: width_px
        type: int | None
      - name: n_z_planes
        type: int | None
        doc: "Number of focal planes for volumetric stacks; null for 2D."
      - name: is_registered_to_expression
        type: bool
        default: false
        doc: >-
          Whether the image frame has been aligned to the expression
          coordinate frame. False means obs pixel coordinates and crop boxes
          are only valid in this image's own frame.
      - name: source_path
        type: str | None
        doc: "Where the image came from, e.g. an OME-TIFF path or URL."
      - name: description
        type: str | None
