repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # schema/schema.py is generated from the schema YAML IR by the
      # atlas-designer validator; it is committed as the emitter writes it so
      # regenerating never produces a formatting-only diff.
      - id: ruff-check
        args: [--fix]
        exclude: ^schema/schema\.py$
      - id: ruff-format
        exclude: ^schema/schema\.py$
