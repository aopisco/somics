[project]
name = "somics"
version = "0.1.0"
description = "Tools for working with spatial omics datasets."
readme = "README.md"
authors = [
    { name = "conradry", email = "conradry71@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "homeobox==0.2.9",
    "pillow>=12.3.0",
    "polycomb==0.0.3",
    "tifffile>=2026.8.23",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
