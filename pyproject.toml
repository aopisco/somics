[project]
name = "somics"
version = "0.1.0"
description = "Tools for working with spatial omics datasets."
readme = "README.md"
authors = [
    { name = "conradry", email = "conradry71@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "homeobox==0.2.8",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
